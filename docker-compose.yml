# 一键启动：docker compose up --build
# 前端 http://localhost:3000  后端 http://localhost:4000
# 测试账号见 README（owner1 / cs1 / art1 / sup1 / fin1 / manager1，密码均 123456）
services:
  db:
    image: mariadb:10.11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: pet_aftercare
      MARIADB_USER: petapp
      MARIADB_PASSWORD: petapp123
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: petapp
      DB_PASS: petapp123
      DB_NAME: pet_aftercare
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mariadb-data:
